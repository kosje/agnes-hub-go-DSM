<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agnes AI 助手</title>
<style>
:root{--bg:#f0f2f5;--panel:#ffffff;--line:#dfe1e6;--ink:#1c2430;--muted:#65717f;--brand:#2f6fed;--brand-soft:#eaf1ff;--good:#12805c;--good-soft:#e7f6ef;--warn:#a86400;--warn-soft:#fdf3e2;--bad:#c0293b;--bad-soft:#fdecee;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:all .15s}
button:hover{border-color:#c9cfd8;transform:translateY(-1px)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button.primary:hover{background:#1d5ed8;border-color:#1d5ed8}
button.sm{padding:5px 10px;font-size:12px;border-radius:7px}
button.danger{color:var(--bad);border-color:#f0cdd2}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.login{max-width:400px;margin:10vh auto}
.hide{display:none!important}
.banner{padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:12px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.good{background:var(--good-soft);color:var(--good)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.muted{color:var(--muted)}
input,select,textarea{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff;color:var(--ink);transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{min-height:90px;resize:vertical}
.topbar{display:flex;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10}
.topbar h1{font-size:17px;font-weight:650;margin:0;color:var(--brand)}
.topbar .logo{font-size:22px;margin-right:4px}
.topbar-info{flex:1;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-layout{display:flex;height:calc(100vh - 56px)}
.chat-main{flex:1;display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;gap:4px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.tabs button{padding:8px 18px;border-radius:20px;font-size:13px;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--muted)}
.tabs button:hover{border-color:var(--brand);color:var(--brand)}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.msg-list{flex:1;overflow-y:auto;padding:20px;background:linear-gradient(180deg,#f8f9fb 0%,var(--bg) 100%)}
.msg{margin-bottom:16px;max-width:80%;display:flex;flex-direction:column;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{margin-left:auto;align-items:flex-end}
.msg.ass{margin-right:auto;align-items:flex-start}
.msg-bubble{padding:12px 16px;border-radius:16px;word-break:break-word;font-size:14px;line-height:1.6;white-space:pre-wrap}
.msg.user .msg-bubble{background:var(--brand);color:#fff;border-radius:16px 16px 4px 16px}
.msg.ass .msg-bubble{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 16px 4px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.msg img{max-width:100%;border-radius:12px;margin-top:8px;cursor:pointer;transition:transform .15s}
.msg img:hover{transform:scale(1.02)}
.msg-meta{font-size:11px;color:var(--muted);margin-top:4px;padding:0 4px}
.input-area{padding:16px;border-top:1px solid var(--line);background:var(--panel)}
.input-row{display:flex;gap:10px;align-items:flex-end;background:var(--bg);padding:10px;border-radius:14px;border:1px solid var(--line)}
.input-row:focus-within{border-color:var(--brand);background:var(--panel);box-shadow:0 0 0 3px var(--brand-soft)}
.msg-input{flex:1;resize:none;background:transparent;border:none;padding:4px;font-size:14px}
.msg-input:focus{outline:none}
.send-btn{height:40px;padding:0 20px;font-weight:500;border-radius:12px}
.sidebar{width:260px;border-left:1px solid var(--line);padding:16px;overflow-y:auto;background:var(--panel)}
.sidebar h3{font-size:12px;color:var(--muted);margin:0 0 12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.history-item{padding:10px;border-radius:10px;margin-bottom:6px;cursor:pointer;border:1px solid var(--line);font-size:12px;transition:all .15s}
.history-item:hover{background:var(--brand-soft);border-color:var(--brand);transform:translateX(2px)}
.history-item.active{border-color:var(--brand);background:var(--brand-soft)}
.history-item .h-title{font-weight:500;color:var(--ink);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-item .h-meta{color:var(--muted);font-size:11px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-image{max-width:100%;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.video-wrap{position:relative;padding-bottom:56.25%;height:0;border-radius:12px;overflow:hidden}
.video-wrap video{position:absolute;inset:0;width:100%;height:100%;border-radius:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:#eef1f5;color:var(--muted);margin-left:6px}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px}
.img-grid img{width:100%;border-radius:12px;cursor:pointer;border:1px solid var(--line);transition:all .15s;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.img-grid img:hover{transform:scale(1.02);box-shadow:0 4px 16px rgba(0,0,0,.12)}
.hist-head{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;font-size:12px;color:var(--muted)}
.history-item{position:relative;padding-right:30px}
.history-item .del{position:absolute;top:8px;right:8px;width:20px;height:20px;line-height:1;padding:0;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:14px;cursor:pointer;opacity:0;transition:opacity .15s}
.history-item:hover .del{opacity:1}
.history-item .del:hover{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}

/* 生图设置面板 */
.img-settings{background:var(--bg);border-radius:12px;padding:14px;margin-bottom:14px;border:1px solid var(--line)}
.img-settings h4{font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:600}
.setting-row{display:flex;gap:10px;margin-bottom:10px}
.setting-row:last-child{margin-bottom:0}
.setting-group{flex:1}
.setting-group label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.setting-group select,.setting-group input{font-size:13px;padding:6px 10px}

/* 快捷预设 */
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.preset-btn{padding:6px 12px;border-radius:20px;font-size:12px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:all .15s}
.preset-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.preset-btn.active{border-color:var(--brand);color:#fff;background:var(--brand)}

/* 空状态 */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .empty-icon{font-size:48px;margin-bottom:16px;opacity:.5}
.empty-state p{font-size:14px;margin:0 0 8px}
</style>
</head>
<body>
<div id="app"></div>
<script src="chat.main.js"></script>
</body>
</html>
