<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agnes Chat</title>
<style>
:root{--bg:#f6f7f9;--panel:#ffffff;--line:#e4e7ec;--ink:#1c2430;--muted:#65717f;--brand:#2f6fed;--brand-soft:#eaf1ff;--good:#12805c;--good-soft:#e7f6ef;--warn:#a86400;--warn-soft:#fdf3e2;--bad:#c0293b;--bad-soft:#fdecee;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button.sm{padding:4px 9px;font-size:12px;border-radius:7px}
button.danger{color:var(--bad);border-color:#f0cdd2}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.login{max-width:380px;margin:8vh auto}
.hide{display:none!important}
.banner{padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.good{background:var(--good-soft);color:var(--good)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.muted{color:var(--muted)}
input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:9px;width:100%}
textarea{min-height:80px;resize:vertical}
.topbar{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.topbar h1{font-size:16px;font-weight:650;margin:0}
.chat-layout{display:flex;height:calc(100vh - 52px)}
.chat-main{flex:1;display:flex;flex-direction:column;min-width:0}
.msg-list{flex:1;overflow-y:auto;padding:16px}
.msg{margin-bottom:14px;max-width:82%;display:flex;flex-direction:column}
.msg.user{margin-left:auto;align-items:flex-end}
.msg.ass{margin-right:auto;align-items:flex-start}
.msg-bubble{padding:9px 13px;border-radius:12px;word-break:break-word;font-size:14px;line-height:1.55;white-space:pre-wrap}
.msg.user .msg-bubble{background:var(--brand);color:#fff}
.msg.ass .msg-bubble{background:var(--panel);border:1px solid var(--line)}
.msg img{max-width:100%;border-radius:8px;margin-top:8px}
.msg-meta{font-size:11px;color:var(--muted);margin-top:3px}
.input-area{padding:12px;border-top:1px solid var(--line);background:var(--panel)}
.input-row{display:flex;gap:8px;align-items:flex-end}
.model-sel{width:180px;flex-shrink:0}
.msg-input{flex:1;resize:none}
.send-btn{height:38px;flex-shrink:0}
.sidebar{width:240px;border-left:1px solid var(--line);padding:12px;overflow-y:auto;background:var(--panel)}
.sidebar h3{font-size:12px;color:var(--muted);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em}
.history-item{padding:8px;border-radius:8px;margin-bottom:6px;cursor:pointer;border:1px solid var(--line);font-size:12px}
.history-item:hover{background:var(--bg)}
.history-item.active{border-color:var(--brand)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-image{max-width:100%;border-radius:8px}
.video-wrap{position:relative;padding-bottom:56.25%;height:0}
.video-wrap video{position:absolute;inset:0;width:100%;height:100%;border-radius:8px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button.on{background:var(--ink);color:#fff}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:#eef1f5;color:var(--muted)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.img-grid img{width:100%;border-radius:8px;cursor:pointer;border:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const state={tab:"chat",session:null,keys:[],activeKey:null,history:[],curHistoryId:null,messages:[],model:"",sending:false,imJobId:null};
const API_URL=""; // relative, same origin
async function api(p,o={}){
  const opts={credentials:"same-origin",headers:{"Content-Type":"application/json"},...o};
  if(state.activeKey) opts.headers["Authorization"]="Bearer "+state.activeKey;
  const r=await fetch(API_URL+p,opts);
  const t=await r.text();
  let d=null; try{d=t?JSON.parse(t):null;}catch(e){d={raw:t};}
  if(!r.ok){const m=(d&&d.error&&d.error.message)||("HTTP "+r.status);throw new Error(m);}
  return d;
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(m,k){const e=document.getElementById("toast");if(!e)return;e.className="banner "+(k||"good");e.textContent=m;e.classList.remove("hide");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add("hide"),4000);}
function fmtDate(ts){if(!ts)return"";const d=new Date(ts*1000);return d.toLocaleDateString()+" "+d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}
function timeAgo(ts){const s=Math.floor(Date.now()/1000)-ts;if(s<60)return s+"s ago";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago";}
</script>
<script src="chat.main.js"></script>
</body>
</html>
