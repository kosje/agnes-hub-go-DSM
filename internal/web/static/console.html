<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agnes Hub 控制台</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --line:#e4e7ec; --ink:#1c2430; --muted:#65717f;
    --brand:#2f6fed; --brand-soft:#eaf1ff; --good:#12805c; --good-soft:#e7f6ef;
    --warn:#a86400; --warn-soft:#fdf3e2; --bad:#c0293b; --bad-soft:#fdecee;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  a{color:var(--brand)}
  h1,h2,h3{margin:0 0 10px;font-weight:650}
  h1{font-size:18px}h2{font-size:15px}h3{font-size:13px;color:var(--muted);text-transform:none}
  code,pre{font-family:var(--mono);font-size:12px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .spread{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .grid{display:grid;gap:12px}
  .g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .kpi .v{font-size:24px;font-weight:700;font-family:var(--mono)}
  .kpi .k{color:var(--muted);font-size:12px;margin-bottom:4px}
  button{font:inherit;padding:7px 13px;border-radius:9px;border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer}
  button:hover{border-color:#c9cfd8}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.primary:hover{filter:brightness(1.06)}
  button.danger{color:var(--bad);border-color:#f0cdd2}
  button.sm{padding:4px 9px;font-size:12px;border-radius:7px}
  input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);
    border-radius:9px;background:#fff;color:var(--ink);width:100%}
  textarea{font-family:var(--mono);font-size:12px;min-height:90px;resize:vertical}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  /* 表头一律不换行：窄列会把「产出」「创建时间」这类短标题竖排成两三个字，
     既难认又白白吃掉行高。 */
  th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc;white-space:nowrap}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;
    background:#eef1f5;color:var(--muted);white-space:nowrap}
  .pill.ok{background:var(--good-soft);color:var(--good)}
  .pill.off{background:var(--bad-soft);color:var(--bad)}
  .pill.info{background:var(--brand-soft);color:var(--brand)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .muted{color:var(--muted)}
  .mono{font-family:var(--mono)}
  .nowrap{white-space:nowrap}
  .copyable{cursor:copy}
  .copyable:hover{color:var(--brand)}
  .scroll{overflow:auto;max-height:520px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tabs button{border-radius:999px;padding:6px 14px}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .hide{display:none!important}
  .banner{padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
  .banner.warn{background:var(--warn-soft);color:var(--warn)}
  .banner.good{background:var(--good-soft);color:var(--good)}
  .banner.info{background:var(--brand-soft);color:var(--brand)}
  .banner.bad{background:var(--bad-soft);color:var(--bad)}
  /* 「查看全部版本」——GitHub 徽标链接。
     图标用内联 SVG：控制台是 go:embed 进二进制的，NAS 上多半连不上外网 CDN，
     不能依赖外部图标资源。绿色 + 下划线是 GitHub 自己的链接观感。 */
  .gh-link{display:inline-flex;align-items:center;gap:6px;color:var(--good);
    font-weight:600;font-size:13px;text-decoration:none;
    border-bottom:1px solid currentColor;padding-bottom:1px;line-height:1.25}
  .gh-link:hover{color:#0d6b4c}
  .gh-link svg{width:15px;height:15px;fill:currentColor;flex:none}
  .bar{height:7px;border-radius:999px;background:#eef1f5;overflow:hidden;min-width:70px}
  .bar>i{display:block;height:100%;background:var(--brand)}
  .login{max-width:380px;margin:8vh auto}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  details summary{cursor:pointer;color:var(--brand);font-size:13px}

/* ============ 移动端适配 ============ */
@media (max-width:768px){
  body{font-size:15px}
  h1{font-size:16px}
  .spread{flex-direction:column;align-items:stretch;gap:8px}
  .spread > div:last-child{display:flex;flex-wrap:wrap;gap:6px}
  .kpi .v{font-size:20px}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .tabs{gap:4px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{white-space:nowrap;padding:5px 11px;font-size:13px}
  .scroll{max-height:400px}
  table{font-size:13px}
  th,td{padding:6px 8px}
  td .row{gap:4px;flex-wrap:wrap}
  button.sm{padding:4px 8px;font-size:11px}
  .card{padding:12px;margin-bottom:10px}
}
@media (min-width:769px){
  .tabs{overflow-x:visible}
}
/* ============ 弹窗 ============ */
.modal-back{position:fixed;inset:0;background:rgba(16,22,30,.45);display:flex;align-items:flex-start;
  justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;
  max-width:780px;width:100%;box-shadow:0 14px 44px rgba(0,0,0,.20)}
.modal .grid{grid-template-columns:1fr 1fr}
.modal h2{margin-bottom:12px}
</style>
</head>
<body>

<div id="app"></div>
<div id="modalRoot"></div>

<script>
const POOLS = ["text","image_1k","image_2k","image_3k","image_4k","video"];
const MODALITIES = ["text","image","video"];
// videoRoutePrefix 是本地落盘视频的地址前缀。判断要用 includes 而不是 startsWith ——
// 1.0.16 起为了外部客户端，地址已改成绝对地址（http://host/api/chat/videos/...）。
const videoRoutePrefix = "/api/chat/videos/";
const TYPES = ["free","enterprise","tokenplan","amd","openrouter"];
// 各 access_type 的默认 Base URL（与后端 DefaultBaseURLByType 对应）。
const DEFAULT_BASE_BY_TYPE = {
  free: "https://apihub.agnes-ai.com/v1",
  enterprise: "https://apihub.agnes-ai.com/v1",
  tokenplan: "https://apihub.agnes-ai.com/v1",
  amd: "https://developer.amd.com.cn/radeon/api/v1",
  openrouter: "https://openrouter.ai/api/v1"
};
const state = { tab:"overview", session:null, stats:null, accounts:null, keys:[], logs:[], settings:null, jobs:[], bindings:[] };

/* ---------------- 基础 ---------------- */
async function api(path, opts={}){
  // 声明「这次请求来自网关自家网页」——服务端据此决定生成的图片/视频回本地地址
  // 还是上游地址（外部 AI 客户端加载不了指向 NAS 的 http 地址）。
  const headers = {"Content-Type":"application/json", "X-Agnes-Hub-Surface":"web", ...(opts.headers||{})};
  const r = await fetch(path, {credentials:"same-origin", ...opts, headers});
  const text = await r.text();
  let data = null;
  try{ data = text ? JSON.parse(text) : null; }catch(e){ data = {raw:text}; }
  if(!r.ok){
    const msg = (data && data.error && data.error.message) || ("HTTP "+r.status);
    const err = new Error(msg); err.status = r.status; err.data = data; throw err;
  }
  return data;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(n){ return Number(n||0).toLocaleString("en-US"); }
function toast(msg, kind){ const el=document.getElementById("toast"); if(!el) return;
  el.className = "banner "+(kind||"good"); el.textContent = msg; el.classList.remove("hide");
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.add("hide"), 4200); }

/* ---------------- 登录 ---------------- */
function renderLogin(mustChange){
  document.getElementById("app").innerHTML = `
  <div class="login">
    <div class="card">
      <h1>Agnes Hub 控制台</h1>
      <p class="muted">Agnes Hub 聚合网关 · RPM 排队限流</p>
      <div id="toast" class="hide"></div>
      <label>管理员密码</label>
      <input id="pw" type="password" placeholder="请输入管理员密码" autocomplete="current-password">
      <div class="row" style="margin-top:12px">
        <button class="primary" id="btnLogin">登录</button>
        ${mustChange?`<span class="pill warn">首次登录请改密</span>`:""}
      </div>
      <div class="hint">登录状态保持 7 天；改密后所有会话立即失效。</div>
    </div>
  </div>`;
  const go = async ()=>{
    try{
      const r = await api("/api/login",{method:"POST",body:JSON.stringify({password:document.getElementById("pw").value})});
      state.session = {logged_in:true, must_change_password:r.must_change_password};
      await boot();
    }catch(e){ toast(e.message,"bad"); }
  };
  document.getElementById("btnLogin").onclick = go;
  document.getElementById("pw").onkeydown = e=>{ if(e.key==="Enter") go(); };
  document.getElementById("pw").focus();
}

/* ---------------- 主框架 ---------------- */
const TABS = [
  ["overview","总览"],["accounts","账号池"],["keys","下游密钥"],
  ["queue","队列"],["jobs","视频任务"],["intent","意图测试"],["logs","日志"],
  ["settings","设置"],["about","系统"]
];
function renderShell(){
  document.getElementById("app").innerHTML = `
  <div style="max-width:1240px;margin:0 auto;padding:20px">
    <div class="spread" style="margin-bottom:14px">
      <div>
        <h1>Agnes Hub 控制台</h1>
        <div class="muted" id="subline">加载中…</div>
      </div>
      <div class="row">
        <a class="sm primary" href="/chat" target="_blank" rel="noopener" style="text-decoration:none">💬 对话 UI</a>
        <button class="sm" id="btnRefresh">刷新</button>
        <button class="sm" id="btnPw">修改密码</button>
        <button class="sm danger" id="btnLogout">退出</button>
      </div>
    </div>
    <div id="mustChange" class="hide"></div>
    <div id="toast" class="hide"></div>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>`;
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = TABS.map(([k,label])=>`<button data-tab="${k}" class="${state.tab===k?"on":""}">${label}</button>`).join("");
  tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; renderShell(); refresh(); });
  document.getElementById("btnRefresh").onclick = ()=>refresh();
  document.getElementById("btnLogout").onclick = async ()=>{ await api("/api/logout",{method:"POST"}); location.reload(); };
  document.getElementById("btnPw").onclick = changePassword;
  if(state.session?.must_change_password){
    const el = document.getElementById("mustChange");
    el.className = "banner warn";
    el.innerHTML = `为保障安全，请立即设置一个新管理员密码。<button class="sm primary" style="margin-left:8px" onclick="changePassword()">去修改</button>`;
  }
}
async function changePassword(){
  const a = prompt("输入新密码（至少 6 位）"); if(!a) return;
  const b = prompt("再输入一次确认"); if(a!==b){ alert("两次输入不一致"); return; }
  try{ await api("/api/password",{method:"POST",body:JSON.stringify({new_password:a})});
    state.session.must_change_password=false; toast("密码已修改","good"); renderShell(); }
  catch(e){ alert(e.message); }
}

/* ---------------- 总览 ---------------- */
function arrivalCard(s){
  const a = s.arrival;
  if(!a || !Array.isArray(a.per_second) || a.per_second.length===0) return "";
  const maxVal = Math.max(1, ...a.per_second);
  // 迷你直方图（60 格，绿 = 节拍内，橙 = 超节拍）
  const intervalSec = a.text_interval_ms ? a.text_interval_ms/1000 : 3.0;
  const bars = a.per_second.map((v,i)=>{
    const h = Math.round(v/maxVal*100)||0;
    const over = intervalSec>0 && v > intervalSec;
    const color = over ? "var(--warn, #f59e0b)" : "var(--good, #22c55e)";
    return `<div title="${i}s 前 · ${v} req" style="height:28px;align-items:flex-end;display:flex">
      <div style="width:100%;height:${Math.max(2,h)}%;background:${v>0?color:"#333"};border-radius:1px;min-height:${v>0?2:0}px"></div></div>`;
  }).join("");
  const ratio = a.ratio||0;
  const ratioColor = ratio>=1?"var(--good,#22c55e)":"var(--warn,#f59e0b)";
  const ratioLabel = ratio>=1?"到达密度 ≥ 节拍，多账号已被吃到":
    ratio>=0.5?"到达密度接近节拍，账号数基本用满":
    "到达密度低于节拍，账号数不是瓶颈（宿主在串行）";
  return `
  <div class="card" style="margin-bottom:14px">
    <h2>到达密度 vs 文本池节拍 <span class="muted" style="font-size:12px">（多账号吞吐判定）</span></h2>
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">
      <div style="flex:1;min-width:240px">
        <div style="display:flex;gap:2px;align-items:flex-end;height:28px;margin-bottom:4px">${bars}</div>
        <div class="muted" style="font-size:11px">最近 60 秒到达时间线（绿 = 节拍内 · 橙 = 超节拍）</div>
      </div>
      <div style="min-width:180px">
        <div style="font-size:24px;font-weight:600;color:${ratioColor}">${num(a.active_60s)}<span style="font-size:13px;color:inherit;font-weight:400"> / 60s</span></div>
        <div class="muted" style="font-size:12px">均值 ${a.avg_per_sec} req/s · text ${a.text_rpm||"—"} RPM · 节拍 ${a.text_interval_ms||"—"}ms</div>
        <div class="muted" style="font-size:12px;margin-top:6px;padding:6px 10px;background:rgba(0,0,0,.04);border-radius:6px">
          <span style="color:${ratioColor};font-weight:600">比值 ${ratio}</span>：${ratioLabel}
        </div>
      </div>
    </div>
  </div>`;
}

function viewOverview(){
  const s = state.stats || {}, m = s.metrics || {};
  const uls = m.upstream_429 || 0;
  const banner = uls === 0
    ? `<div class="banner good">上游 429 次数为 0 —— 限流排队生效，客户端没有被限流过。</div>`
    : `<div class="banner warn">上游已返回 ${uls} 次 429。系统会自动下调该账号该池的节拍（其它池不受影响），并已把客户端请求排队而非报错。</div>`;
  const accRows = (s.accounts||[]).map(a=>{
    const buckets = a.buckets||{};
    const active = POOLS.filter(p=>buckets[p] && buckets[p].rpm>0);
    const bars = active.map(p=>{
      const b = buckets[p]||{};
      const load = Math.min(100, Math.round((b.waiting? (b.projected_wait_ms/1000)*100/6 : 0)));
      return `<div style="margin-bottom:4px">
        <span class="pill ${b.factor<1?"warn":""}">${esc(p)} · ${b.rpm} RPM</span>
        <span class="muted" style="font-size:11px">排队 ${b.waiting} 人 · 预计 ${Math.round((b.projected_wait_ms||0)/100)/10}s · 校准 ${b.factor}</span>
        <div class="bar"><i style="width:${load}%"></i></div>
      </div>`;
    }).join("");
    const declared = MODALITIES.map(mod=>{
      const list = [];
      active.forEach(p=>{ (buckets[p]?.declared||[]).forEach(x=>{ if(!list.includes(x)) list.push(x); }); });
      return list.length? `<div class="muted" style="font-size:11px">${esc(mod)}: <span class="mono">${esc(list.join(", "))}</span></div>`:"";
    }).join("");
    return `<tr>
      <td><b>${esc(a.name)}</b>${a.group?` <span class="pill">${esc(a.group)}</span>`:""}
        <div class="muted" style="font-size:11px">${esc(a.access_type)}</div></td>
      <td>${a.enabled?'<span class="pill ok">启用</span>':'<span class="pill off">停用</span>'}
        ${a.penalty_remaining_ms>0?`<span class="pill warn">冷却 ${Math.round(a.penalty_remaining_ms/1000)}s</span>`:""}
        ${a.consecutive_failures && a.stats?.errors ? `<span class="pill warn" title="连续失败 ${a.consecutive_failures}">连续失败 ${a.consecutive_failures}</span>` : ''}</td>
      <td style="min-width:210px">${bars||'<span class="muted">无可用池</span>'}${declared}</td>
      <td class="mono">${num(a.stats?.requests)} / 错误 ${num(a.stats?.errors)} / 限流 ${num(a.stats?.rate_limited)}</td>
    </tr>`;
  }).join("");
  return `
  ${banner}
  <div class="grid g4" style="margin-bottom:14px">
    <div class="kpi"><div class="k">请求总数</div><div class="v">${num(m.requests_total)}</div></div>
    <div class="kpi"><div class="k">成功</div><div class="v">${num(m.requests_ok)}</div></div>
    <div class="kpi"><div class="k" style="color:${uls?"var(--good)":"var(--muted)"}">上游 429</div><div class="v" style="color:${uls?"var(--good)":"inherit"}">${num(uls)}</div></div>
    <div class="kpi"><div class="k">排队过</div><div class="v">${num(m.queued_total)}</div></div>
    <div class="kpi"><div class="k">平均等待</div><div class="v">${num(s.avg_wait_ms)}<span style="font-size:13px">ms</span></div></div>
    <div class="kpi"><div class="k">粘性溢出</div><div class="v">${num(m.spillovers)}</div><div class="muted" style="font-size:11px">绑定账号拥堵时改派次数</div></div>
    <div class="kpi"><div class="k">熔断 / 复活</div><div class="v">${num(m.breaker_opened)} / ${num(m.breaker_revived)}</div></div>
    <div class="kpi"><div class="k">账号 / 密钥</div><div class="v">${num((s.accounts||[]).length)} / ${num(s.keys)}</div></div>
  </div>
  ${arrivalCard(s)}
  <div class="card">
    <h2>账号负载</h2>
    <div class="scroll"><table>
      <thead><tr><th>账号</th><th>状态</th><th>各池节拍与已声明模型</th><th>累计</th></tr></thead>
      <tbody>${accRows||'<tr><td colspan="4" class="muted">还没有账号，请到「账号池」添加</td></tr>'}</tbody>
    </table></div>
  </div>`;
}

/* ---------------- 账号池 ---------------- */
function manifestEditor(id, manifest){
  const m = manifest || {};
  return MODALITIES.map(mod=>`
    <div>
      <label>${mod} 模型（逗号分隔；<b>留空 = 明示不支持该模态</b>）</label>
      <input id="${id}_${mod}" value="${esc((m[mod]||[]).join(", "))}" placeholder="例如 default-model, default-model">
    </div>`).join("");
}
function viewAccounts(){
  const data = state.accounts || {accounts:[]};
  const rows = (data.accounts||[]).map(a=>{
    const eff = a.rpm_effective||{}, base = a.rpm_base||{};
    const rpm = POOLS.filter(p=>(base[p]||0)>0).map(p=>{
      const b = base[p], e = eff[p];
      return `<span class="pill ${e<b?"warn":""}" title="标称 ${b} → 校准后 ${e}">${p} ${e}</span>`;
    }).join(" ");
    return `<tr>
      <td><b>${esc(a.name)}</b>
        <div class="muted" style="font-size:11px">${esc(a.group||"—")} · ${esc(a.access_type)} · <span class="mono">${esc(a.api_key_masked)}</span></div>
        <div class="muted" style="font-size:11px" title="${esc(a.base_url)}">${esc(a.base_url)}</div>
        <div class="muted mono" style="font-size:11px">text: ${esc((a.model_manifest?.text||[]).join(", ")||"（不支持）")}</div>
        <div class="muted mono" style="font-size:11px">image: ${esc((a.model_manifest?.image||[]).join(", ")||"（不支持）")}</div>
        <div class="muted mono" style="font-size:11px">video: ${esc((a.model_manifest?.video||[]).join(", ")||"（不支持）")}</div>
      </td>
      <td>${a.enabled?'<span class="pill ok">启用</span>':'<span class="pill off">停用</span>'}
        ${a.penalty_remaining_ms>0?`<span class="pill warn">冷却</span>`:""}
        ${a.stats?.rate_limited?`<span class="pill warn">限流 ${a.stats.rate_limited}</span>`:""}</td>
      <td style="min-width:220px">${rpm}</td>
      <td class="row" style="gap:4px">
        <button class="sm" data-act="test" data-id="${esc(a.id)}">测试</button>

  };
  const bulk = document.getElementById("btnBulk");

      await refresh();

/* ---------------- 上游可用模型探测 ----------------
   控制台里的模型清单是手填的，上游改了可售清单本地不会知道，
   表现就是「模型明明填了却一直报错」。这个按钮拿账号自己的 Key 去问上游
   /v1/models，把「上游实际给的」与「本地清单填的」对一遍。 */
function bindUpstreamModels(){
  const btn = document.getElementById("btnUpModels");
  const box = document.getElementById("upModelsBox");
  if(!btn || !box) return;
  btn.onclick = async ()=>{
    btn.disabled = true; btn.textContent = "查询中…";
    box.innerHTML = '<div class="muted">正在向各账号的上游查询模型列表…</div>';
    try{
      const r = await api("/api/models/upstream",{method:"POST",body:JSON.stringify({})});
      box.innerHTML = renderUpstreamModels(r);
    }catch(e){
      box.innerHTML = `<div class="banner bad">${esc(e.message)}</div>`;
    }finally{
      btn.disabled = false; btn.textContent = "向上游拉取可用模型";
    }
  };
}
function renderUpstreamModels(r){
  const results = r.results || [];
  if(results.length === 0) return '<div class="banner info">没有启用中的账号可探测。</div>';
  const mods = r.by_modality || {};
  const summary = MODALITIES.map(m=>{
    const list = mods[m] || [];
    return `<div class="kpi"><div class="k">上游可用的 ${m} 模型（${list.length}）</div>
      <div class="v" style="font-size:12px;font-family:var(--mono);word-break:break-all">${esc(list.join(", ")||"—")}</div></div>`;
  }).join("");
  const rows = results.map(x=>{
    const miss = x.missing || {};
    const missKeys = Object.keys(miss);
    const missHTML = missKeys.length
      ? missKeys.map(m=>`<div class="banner bad" style="margin:6px 0 0">
          本地清单里的 <b>${esc(m)}</b> 模型上游没给：<span class="mono">${esc(miss[m].join(", "))}</span>
        </div>`).join("")
      : (x.ok ? '<div class="banner good" style="margin:6px 0 0">本地清单里的模型上游都有。</div>' : "");
    const head = x.ok
      ? `<span class="pill ok">${x.count} 个模型</span>`
      : `<span class="pill off">HTTP ${x.status||"—"}</span>`;
    return `<div class="card" style="margin:10px 0 0">
      <div class="spread"><b>${esc(x.account_name)}</b><span>${head}</span></div>
      <div class="muted mono" style="font-size:11px">${esc(x.base_url)}</div>
      ${x.ok ? `<div class="mono muted" style="font-size:11px;margin-top:6px;word-break:break-all">${esc((x.models||[]).join(", "))}</div>` : ""}
      ${x.error ? `<div class="banner bad" style="margin:6px 0 0">${esc(x.error)}</div>` : ""}
      ${missHTML}
    </div>`;
  }).join("");
  return `<div class="grid g4">${summary}</div>${rows}
    <div class="hint" style="margin-top:8px">${esc(r.probe_note||"")}（${esc(r.probed_at||"")}）</div>`;
}

function openModal(html){

  if(!r){ r = document.createElement("div"); r.id="modalRoot"; document.body.appendChild(r); }
  r.innerHTML = html;
}
function closeModal(){ const r = document.getElementById("modalRoot"); if(r) r.innerHTML = ""; }

          <div class="row" style="margin-top:8px">

    if(baseEl && baseEl.value.trim()==="") baseEl.placeholder = "留空将自动套用：" + (DEFAULT_BASE_BY_TYPE[eType.value]||"");
  };
  document.getElementById("btnSaveAcc").onclick = async ()=>{
    try{
      const manifest = {}; MODALITIES.forEach(m=>manifest[m]=document.getElementById("eMf_"+m).value.split(",").map(s=>s.trim()).filter(Boolean));
      const rpmOv = {}; POOLS.forEach(p=>{ const v=document.getElementById("eRPM_"+p).value.trim(); if(v!=="") rpmOv[p]=Number(v); });
      const body = {
        name:document.getElementById("eName").value, base_url:document.getElementById("eBase").value,
        access_type:document.getElementById("eType").value, group:document.getElementById("eGroup").value,
        max_concurrency:Number(document.getElementById("eConc").value)||8,
        priority:Number(document.getElementById("ePriority").value)||0,

      };
      const k = document.getElementById("eKey").value.trim(); if(k!=="") body.api_key = k;
      await api("/api/accounts/"+id,{method:"PATCH",body:JSON.stringify(body)});
      toast("已保存","good"); closeModal(); await refresh();

async function accountAction(act,id,on){
  try{
    if(act==="test"){
      toast("正在测试…（会向上游发一个最小请求）","warn");
      const r = await api("/api/accounts/"+id+"/test",{method:"POST"});
      const drift = (r.drift||[]).map(d=>`<div class="banner warn">${esc(d.modality)} 的 <span class="mono">${esc(d.model)}</span>：${esc(d.issue)}</div>`).join("");
      document.getElementById("view").insertAdjacentHTML("afterbegin",
        `<div class="card"><div class="spread"><h2>测试结果</h2><button class="sm" onclick="this.closest('.card').remove()">关闭</button></div>
          <div class="banner ${r.ok?"good":"bad"}">HTTP ${r.status} · ${r.latency_ms}ms · ${esc(r.hint)}</div>
          ${drift}
          ${r.models&&r.models.length?`<details open><summary>上游真实可用模型（${r.models.length}）</summary>
            <div class="mono" style="margin-top:8px;font-size:12px">${esc(r.models.join(", "))}</div></details>`:""}
          ${r.body?`<details><summary>响应体</summary><pre class="mono">${esc(r.body)}</pre></details>`:""}
        </div>`);
      return;
    }
    if(act==="toggle"){ await api("/api/accounts/"+id,{method:"PATCH",body:JSON.stringify({enabled:on!=="1"})}); }
    if(act==="factors"){ await api("/api/accounts/"+id+"/reset-factors",{method:"POST"}); toast("校准系数已复位","good"); }
    if(act==="del"){ if(!confirm("确认删除该账号？")) return; await api("/api/accounts/"+id,{method:"DELETE"}); }
    if(act==="edit"){
      const acc = (state.accounts.accounts||[]).find(x=>x.id===id); if(!acc) return;
      editAccountModal(acc);
    }
    await refresh();
  }catch(e){ toast(e.message,"bad"); }
}

// shortID 把 64 字符的 job_id / video_id 压成「前 8…后 4」。
//
// 这些 id 是不换行的长串，原样铺进表格会把整张表撑出横向滚动条，
// 其余列全被挤到换行。完整值放在 title 里、点一下可复制。
function shortID(s){
  s = String(s==null?"":s);
  if(s.length<=16) return s;
  return s.slice(0,8)+"…"+s.slice(-4);
}

// accName 把 account_id 换成可读的账号名（任务记录里只存了 id）。
function accName(id){
  const list = (state.accounts && state.accounts.accounts) || [];
  const a = list.find(x=>x.id===id);
  return a ? a.name : "";
}

function jobStatusClass(s){
  switch(s){
    case "completed": return "ok";
    case "failed": return "off";
    case "submitted": case "in_progress": case "queued": return "warn";
    default: return "info";
  }
}

// jobOutputCell 决定「产出」列显示什么。
//
// 注意 url 现在可能是绝对地址（1.0.16 起为了外部客户端改成绝对地址），
// 所以判断用 includes 而不是 startsWith。
function jobOutputCell(j){
  if((j.url||"").includes(videoRoutePrefix)){
    return `<button class="sm" data-play="${esc(j.url)}">播放</button>`;
  }
  if(j.status==="completed"){
    return `<button class="sm" data-refetch="${esc(j.job_id)}"
      title="这条记录产生于本地落盘功能上线之前，点一下去上游把产出取回本地">补取</button>`;
  }
  return '<span class="muted">—</span>';
}

// copyText 复制到剪贴板。
//
// 必须带兜底：控制台常通过局域网 http 访问，那种非安全上下文里
// navigator.clipboard 是 undefined，只有老办法能用。
async function copyText(v){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(v);
      return true;
    }
  }catch(e){}
  try{
    const ta = document.createElement("textarea");
    ta.value = v;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

function bindJobEvents(){
  const box = document.getElementById("jobPlayer");
  if(!box) return;
  document.querySelectorAll("button[data-play]").forEach(b=>b.onclick=()=>{
    const u = b.dataset.play || "";
    // 只接受本机落盘的地址，避免把上游 CDN 链接渲染进来（那些地址浏览器
    // 常常够不到，而且落盘之后也没必要再回上游取）。
    if(!u.includes(videoRoutePrefix)){ toast("该记录没有本地副本","bad"); return; }
    box.innerHTML = `<video controls autoplay src="${esc(u)}"
      style="width:100%;max-width:640px;margin-bottom:10px;border-radius:10px"></video>`;
    box.scrollIntoView({behavior:"smooth", block:"nearest"});
  });
  document.querySelectorAll("[data-copy]").forEach(el=>el.onclick=async ()=>{
    const ok = await copyText(el.dataset.copy);
    toast(ok ? "已复制完整 ID" : "复制失败，请手动选中后复制", ok ? "good" : "bad");
  });
  document.querySelectorAll("button[data-refetch]").forEach(b=>b.onclick=async ()=>{
    const id = b.dataset.refetch;
    b.disabled = true; b.textContent = "取回中…";
    try{
      const r = await api("/api/video-jobs/"+encodeURIComponent(id)+"/refetch",{method:"POST",body:"{}"});
      if(r.video_url){ toast("已取回本地副本","good"); await refresh(); }
      else toast(r.error||"上游暂未给出产出地址","bad");
    }catch(e){ toast(e.message,"bad"); }
    finally{ b.disabled = false; b.textContent = "补取"; }
  });
}

  const exp = (masked)=>async ()=>{
    window.open("/api/export","_blank");
    if(!masked) toast("含密钥的导出请用 /api/export 的结果自行保存","warn");
  };
  document.getElementById("btnExport").onclick = exp(true);
  document.getElementById("btnExportFull").onclick = exp(true);
  document.getElementById("btnImport").onclick = async ()=>{
    const text = prompt("粘贴导出的 JSON（会追加账号，不覆盖现有）"); if(!text) return;
    try{
      const data = JSON.parse(text);
      data.mode = "append";
      const r = await api("/api/import",{method:"POST",body:JSON.stringify(data)});
      toast(`已导入 ${r.accounts_imported} 个账号`,"good"); await refresh();
    }catch(e){ toast("导入失败："+e.message,"bad"); }
  };
}

/* ---------------- 数据拉取 ---------------- */
async function refresh(){
  try{
    const [stats, accounts, keys, logs, settings, jobs, bindings] = await Promise.all([
      api("/api/stats"), api("/api/accounts"), api("/api/keys"), api("/api/logs?limit=300"),
      api("/api/settings"), api("/api/video-jobs"), api("/api/bindings")
    ]);
    state.stats = stats; state.accounts = accounts; state.keys = keys.keys||[];
    state.logs = logs.logs||[]; state.settings = settings;
    state.jobs = jobs.jobs||[]; state.bindings = bindings.bindings||[];
    state.stats.queue = (await api("/api/queue")).queue||[];
    const m = stats.metrics||{};
    document.getElementById("subline").textContent =
      `账号 ${(stats.accounts||[]).length} · 请求 ${num(m.requests_total)} · 上游 429 ${num(m.upstream_429)} · 排队 ${num(m.queued_total)} · 运行 ${m.uptime_sec||0}s`;
    render();
  }catch(e){
    if(e.status===401){ renderLogin(false); return; }
    toast(e.message,"bad");
  }
}
function render(){
  const v = document.getElementById("view");
  if(state.tab==="overview"){ v.innerHTML = viewOverview(); }
  else if(state.tab==="accounts"){ v.innerHTML = viewAccounts(); bindAccountEvents(); }
  else if(state.tab==="keys"){ v.innerHTML = viewKeys(); bindKeyEvents(); }
  else if(state.tab==="queue"){
    v.innerHTML = viewQueue();
    const b = document.getElementById("btnClearBind");
    if(b) b.onclick = async ()=>{ if(!confirm("清空全部粘性绑定？")) return;
      await api("/api/bindings/clear",{method:"POST"}); await refresh(); };
  }
  else if(state.tab==="jobs"){ v.innerHTML = viewJobs(); bindJobEvents(); }
  else if(state.tab==="intent"){ v.innerHTML = viewIntent(); bindIntentEvents(); }
  else if(state.tab==="logs"){ v.innerHTML = viewLogs(); }
  else if(state.tab==="settings"){ v.innerHTML = viewSettings(); bindSettingsEvents(); }
  else if(state.tab==="about"){ v.innerHTML = viewAbout(); bindAboutEvents(); }
}

/* ---------------- 媒体地址自检 ----------------
   反向代理部署最容易踩的坑：代理把 Host/X-Forwarded-Host 设成 $host（不带端口），
   网关推断出来的基地址就会少一段端口，生成的图片/视频地址在客户端里加载不出来。
   这个按钮直接把「按当前这次请求推算出的地址」摊开，一眼就能看出对不对。 */
function bindMediaBaseCheck(){
  const btn = document.getElementById("btnMediaBase");
  const box = document.getElementById("mediaBaseBox");
  if(!btn || !box) return;
  btn.onclick = async ()=>{
    btn.disabled = true; btn.textContent = "查询中…";
    try{
      const r = await api("/api/media-base");
      const row = (k,v)=>`<div class="row" style="gap:8px"><span class="muted" style="min-width:120px">${esc(k)}</span><span class="mono" style="font-size:12px;word-break:break-all">${esc(v||"—")}</span></div>`;
      const forClient = (r.url_for_client||"");
      const usingLocal = forClient.includes("/api/chat/");
      box.innerHTML = `<div class="card" style="margin:0">
        ${row("基地址", r.base_url)}
        ${row("来源", r.source)}
        ${row("示例图片地址", r.sample_image_url)}
        ${row("客户端将收到", forClient)}
        ${row("客户端媒体地址", r.client_media_url||"upstream（默认）")}
        <div class="hint">诊断用原始值：Host=${esc(r.host||"—")} · X-Forwarded-Host=${esc(r.x_forwarded_host||"—")} · X-Forwarded-Proto=${esc(r.x_forwarded_proto||"—")} · TLS=${r.tls?"是":"否"}</div>
        <div class="banner ${usingLocal?"good":"warn"}" style="margin-top:8px">
          ${usingLocal
            ? "客户端拿到的是本机地址。请确认这个地址从客户端所在网络能打开（把示例图片地址粘到浏览器试一下）。"
            : "客户端拿到的是上游产出地址。若希望用本机地址（离线可看），把上面的「客户端媒体地址」改成「本机地址」并保存。"}
        </div>
      </div>`;
    }catch(e){
      box.innerHTML = `<div class="banner bad">${esc(e.message)}</div>`;
    }finally{
      btn.disabled = false; btn.textContent = "查看当前生效的媒体地址";
    }
  };
}

/* ---------------- 系统 / 自更新 ---------------- */
function viewAbout(){
  return `
  <div class="card">
    <h2>版本与自更新</h2>
    <div class="muted" style="margin-bottom:12px" id="updDesc">
      进入本页会自动向本项目的 GitHub Releases 查询一次最新版本，并显示版本号与发布时间。
    </div>
    <div class="grid g4" id="updKpi"></div>
    <div id="updBox" style="margin-top:12px"></div>
    <div class="row" style="margin-top:12px">
      <span class="row hide" id="updBtns">
        <button class="sm" id="btnChk">检查更新</button>
        <button class="sm primary" id="btnApply">立即更新</button>
      </span>
      <a class="gh-link" id="lnkReleases" target="_blank" rel="noopener noreferrer"
         title="在 GitHub 查看项目仓库"
         href="https://github.com/kosje/agnes-hub-go-DSM/releases">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>GitHub
      </a>
    </div>
  </div>
  <div class="card">
    <h2>运行环境</h2>
    <div class="mono muted" style="font-size:12px" id="envBox">加载中…</div>
  </div>`;
}

function bindAboutEvents(){
  const kpi = document.getElementById("updKpi");
  const box = document.getElementById("updBox");
  const env = document.getElementById("envBox");

  const paintEnv = ()=>{
    const s = state.stats || {}, m = s.metrics || {};
    const up = Number(m.uptime_sec||0);
    const d = Math.floor(up/86400), h = Math.floor(up%86400/3600), mi = Math.floor(up%3600/60);
    env.textContent = `已运行 ${d?d+"天 ":""}${h}小时${mi}分 · 请求总数 ${num(m.requests_total)}`
      + ` · 上游 429 ${num(m.upstream_429)} · 排队 ${num(m.queued_total)}`
      + ` · 账号 ${(s.accounts||[]).length} 个`;
  };

  const paint = (s, err)=>{
    const cur = s.current_version || "—";
    const last = s.last_check || {};
    const avail = !!last.is_update_available;
    // canApply：能否在进程内替换二进制（套件版恒为 false）
    // canCheck：能否向 GitHub 查最新版本（套件版仍为 true）
    const canApply = s.enabled === true;
    const canCheck = s.checkable !== false;

    kpi.innerHTML = `
      <div class="kpi"><div class="k">当前版本</div><div class="v">${esc(cur)}</div></div>
      <div class="kpi"><div class="k">最新版本</div><div class="v">${esc(last.latest_version || "—")}</div></div>
      <div class="kpi"><div class="k">更新状态</div><div class="v" style="font-size:15px">
        ${!canCheck ? '<span class="pill info">无法查询</span>'
              : avail ? '<span class="pill warn">有可用更新</span>'
                      : '<span class="pill ok">已是最新</span>'}</div></div>
      <div class="kpi"><div class="k">发布时间</div><div class="v" style="font-size:15px">${esc(last.release_date || "—")}</div></div>`;

    // 仓库地址跟着后端返回的 repo 走，保证与「最新版本」的实际来源一致。
    // 只改 href —— 链接文字是固定的「GitHub」徽标，改 textContent 会把图标一起抹掉。
    const lnk = document.getElementById("lnkReleases");
    if(lnk) lnk.href = "https://github.com/" + (s.repo || "kosje/agnes-hub-go-DSM") + "/releases";

    // 「检查更新 / 立即更新」只在进程内自更新可用时才露出来。
    // 套件版由套件中心升级，按钮留着只会误导。
    const btns = document.getElementById("updBtns");
    if(btns) btns.classList.toggle("hide", !canApply);

    if(err || last.error){
      box.innerHTML = `<div class="banner warn">${esc(err || last.error)}</div>`;
      return;
    }
    if(!canCheck){
      box.innerHTML = `<div class="banner info">未配置更新仓库，无法查询最新版本。</div>`;
      return;
    }
    if(!avail){
      box.innerHTML = s.suite_managed
        ? `<div class="banner info">已是最新版本。本套件版由群晖套件中心统一升级，
             请在「套件中心 → 社群」检查更新。</div>`
        : `<div class="banner good">当前已是最新版本，无需更新。</div>`;
      return;
    }
    const notes = (last.changelog||"").trim();
    box.innerHTML = `<div class="banner warn">
        发现新版本 <b>${esc(last.latest_version)}</b>（当前 ${esc(cur)}）。
        ${canApply ? "点「立即更新」会下载对应平台的二进制并替换，随后程序自动退出并重启。"
                   : "请在「套件中心 → 社群」升级。"}
      </div>
      ${notes? `<pre class="scroll" style="background:#fafbfc;border:1px solid var(--line);
        border-radius:10px;padding:12px;margin:0">${esc(notes)}</pre>`:""}`;
  };

  const load = async ()=>{
    try{
      const s = await api("/api/update/status");
      paint(s);
      // 还没有检查结果（或上次查失败）时主动查一次 —— 否则「最新版本 / 发布时间」
      // 会一直停在「—」。有缓存就不重复联网，避免反复打开本页把 GitHub 配额打满。
      const last = s.last_check || {};
      if(s.checkable !== false && (!last.latest_version || last.error)){
        paint(await api("/api/update/check"));
      }
    }catch(e){ kpi.innerHTML = `<div class="kpi"><div class="k">错误</div><div class="v">—</div></div>`;
              box.innerHTML = `<div class="banner warn">${esc(e.message)}</div>`; }
  };

  document.getElementById("btnChk").onclick = async (ev)=>{
    const b = ev.currentTarget; b.disabled = true; b.textContent = "检查中…";
    try{ paint(await api("/api/update/check")); toast("已检查更新","good"); }
    catch(e){ toast(e.message,"bad"); }
    finally{ b.disabled = false; b.textContent = "检查更新"; }
  };

  document.getElementById("btnApply").onclick = async (ev)=>{
    const b = ev.currentTarget;
    if(!confirm("确认下载并更新到最新版本？\n更新完成后程序会自动重启。")) return;
    b.disabled = true; b.textContent = "更新中…";
    try{
      const r = await api("/api/update/apply",{method:"POST"});
      if(r.success){
        toast("更新已就位，程序即将重启","good");
        box.innerHTML = `<div class="banner good">已更新到 <b>${esc(r.new_version)}</b>，
          程序正在退出以便替换二进制，稍后会自动重启。若未自动重启，请手动重新启动一次。</div>`;
      }else{
        toast(r.error||"更新失败","bad");
        box.innerHTML = `<div class="banner warn">更新失败：${esc(r.error||"未知原因")}</div>`;
      }
    }catch(e){ toast(e.message,"bad"); }
    finally{ b.disabled = false; b.textContent = "立即更新"; }
  };

  paintEnv();
  load();
}

async function boot(){
  if(!state.session || !state.session.logged_in){ renderLogin(false); return; }
  renderShell();
  await refresh();
}
window.addEventListener("DOMContentLoaded", async ()=>{
  try{
    const s = await api("/api/session");
    state.session = s;
    if(s.logged_in) await boot(); else renderLogin(s.must_change_password);
  }catch(e){ renderLogin(false); }
});
</script>
